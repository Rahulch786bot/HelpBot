version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - helpbot_data:/app/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Point the built frontend at wherever the backend is reachable
        # from the browser -- e.g. http://<ec2-public-ip>:8000
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  helpbot_data:
